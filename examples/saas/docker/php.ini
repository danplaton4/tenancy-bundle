; OPcache — DEV tuning, NOT production-shaped (CONTEXT Critical Edge)
opcache.enable=1
opcache.validate_timestamps=1
opcache.revalidate_freq=0

; Symfony recommended (dev)
memory_limit=256M
max_execution_time=60
date.timezone=UTC

; Realpath cache (modest dev sizing)
realpath_cache_size=4M
realpath_cache_ttl=600
