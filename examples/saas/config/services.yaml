# Standard Symfony 7.4 services config — declares controllers, commands, and other
# App\ classes as autoconfigured services so the container picks them up.
# Was missing from the original Phase 21 scaffold and caused 500s on every route
# until the live Docker stack was actually exercised.

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # Per-tenant filesystem scoping for users.storage is applied via
    # App\DependencyInjection\Compiler\ScopedStorageTaggingPass (registered in
    # Kernel::build()), NOT here. flysystem-bundle builds the `users.storage`
    # definition (class League\Flysystem\Filesystem) during extension load, so
    # the tenancy.scoped tag must be attached to that existing definition at
    # compile time. Declaring `users.storage` here would instead create a
    # classless service that shadows flysystem's and breaks the bundle's
    # FilesystemPrefixingDecorator (the decorated `.inner` would have no class).
