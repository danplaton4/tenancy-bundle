# Standard Symfony 7.4 services config — declares controllers, commands, and other
# App\ classes as autoconfigured services so the container picks them up.
# Was missing from the original Phase 21 scaffold and caused 500s on every route
# until the live Docker stack was actually exercised.

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # Tag users.storage for per-tenant filesystem scoping (prefix mode).
    # The bundle's FilesystemContractPass decorates this service at compile time
    # with FilesystemPrefixingDecorator, which transparently prepends tenant_{slug}/
    # to every Flysystem operation. TenantUploadController's $usersStorage arg
    # receives the decorator — no manual slug handling needed.
    users.storage:
        tags:
            - { name: tenancy.scoped, strategy: prefix, prefix_template: 'tenant_{slug}/' }
