doctrine:
    dbal:
        default_connection: landlord
        connections:
            landlord:
                url: '%env(resolve:DATABASE_URL_LANDLORD)%'
                driver: pdo_mysql
                server_version: 'mariadb-11.0.0'
                charset: utf8mb4
            tenant:
                url: '%env(resolve:DATABASE_URL_LANDLORD)%'
                driver: pdo_mysql
                server_version: 'mariadb-11.0.0'
                charset: utf8mb4
                # No wrapper_class needed — TenancyBundle auto-registers TenantDriverMiddleware
                # on this connection (see src/TenancyBundle.php). The old wrapper_class:
                # Tenancy\Bundle\Doctrine\TenantConnection API was removed before v0.3.

    orm:
        default_entity_manager: landlord
        entity_managers:
            landlord:
                connection: landlord
                mappings:
                    App:
                        is_bundle: false
                        type: attribute
                        dir: '%kernel.project_dir%/src/Entity/Landlord'
                        prefix: 'App\Entity\Landlord'
                        alias: App
                    # The bundle's Tenancy\Bundle\Entity namespace is intentionally NOT
                    # listed here. DemoTenant extends Tenancy\Bundle\Entity\AbstractTenant
                    # (a #[ORM\MappedSuperclass]) and is the only concrete entity mapped to
                    # `tenancy_tenants`. Mapping the bundle's concrete Tenant alongside it
                    # would create two root entities on the same table.
            tenant:
                connection: tenant
                mappings:
                    AppTenant:
                        is_bundle: false
                        type: attribute
                        dir: '%kernel.project_dir%/src/Entity/Tenant'
                        prefix: 'App\Entity\Tenant'
                        alias: AppTenant

when@prod:
    doctrine:
        orm:
            auto_generate_proxy_classes: false
