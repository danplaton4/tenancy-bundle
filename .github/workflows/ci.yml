name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    name: PHP ${{ matrix.php }} / Symfony ${{ matrix.symfony }}
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        symfony: ['7.4.*']
        include:
          - php: '8.4'
            symfony: '8.0.*'
          - php: '8.4'
            symfony: '8.1.*'
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: flex
          coverage: none

      - uses: ramsey/composer-install@v4
        env:
          SYMFONY_REQUIRE: ${{ matrix.symfony }}

      - run: vendor/bin/phpunit

  coverage:
    runs-on: ubuntu-latest
    name: Coverage
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: flex
          coverage: xdebug

      - uses: ramsey/composer-install@v4
        env:
          SYMFONY_REQUIRE: '7.4.*'

      - run: vendor/bin/phpunit --coverage-clover coverage.xml

      - uses: codecov/codecov-action@v6
        with:
          files: ./coverage.xml
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  phpstan:
    runs-on: ubuntu-latest
    name: PHPStan (level 9)
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - uses: ramsey/composer-install@v4

      - run: vendor/bin/phpstan analyse

      - name: PHPStan extension dogfood — run shipped rules on bundle sources
        run: vendor/bin/phpstan analyse -c phpstan-extension-dogfood.neon --memory-limit=512M

  cs-fixer:
    runs-on: ubuntu-latest
    name: PHP CS Fixer
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - uses: ramsey/composer-install@v4

      - run: vendor/bin/php-cs-fixer check --diff --allow-risky=yes

      - name: Docs lint (stale v0.1 term regression guard)
        run: ./scripts/docs-lint.sh

  no-doctrine:
    runs-on: ubuntu-latest
    name: No Doctrine (guards check)
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: flex
          coverage: none

      - uses: ramsey/composer-install@v4

      - name: Remove Doctrine packages and phpstan-doctrine
        # Also removes phpstan/phpstan-doctrine so its ObjectMetadataResolver service disappears.
        # phpstan/phpstan itself is a SEPARATE top-level require-dev entry and is NOT cascade-removed.
        # (Warning 4 guard: the next step asserts phpstan --version exits 0 to prove this.)
        # phpstan/extension-installer is preserved.
        run: composer remove --dev doctrine/orm doctrine/dbal doctrine/doctrine-bundle doctrine/migrations phpstan/phpstan-doctrine --no-interaction

      - name: Assert phpstan survives the Doctrine removal
        # Warning-4 guard: if removing phpstan/phpstan-doctrine ever cascade-removes phpstan/phpstan,
        # this step fails LOUDLY here — the dogfood would then fail because the analyser is gone,
        # not because a guard regressed. This distinction matters for CI triage.
        run: vendor/bin/phpstan --version

      - name: Run unit tests without Doctrine
        # DatabaseSwitchBootstrapperTest is included; it self-skips via class_exists()
        # guard on Doctrine\DBAL\Connection so the test coexists with this job.
        # tests/Unit/PHPStan + SharedEntityMutualExclusionPassTest are included to prove the
        # rule/pass classes LOAD without fatal when Doctrine is absent. Their behavioral
        # assertions self-skip via an interface_exists(EntityManagerInterface) guard, mirroring
        # the optional-dependency contract the rules/pass enforce (they return []/no-op without
        # Doctrine). Graceful degradation is asserted separately by the dogfood step below.
        run: vendor/bin/phpunit tests/Unit/Context tests/Unit/Event tests/Unit/Resolver tests/Unit/Messenger tests/Unit/Cache tests/Unit/Exception tests/Unit/Attribute tests/Unit/DependencyInjection tests/Unit/Command/TenantRunCommandTest.php tests/Unit/Bootstrapper/BootstrapperChainTest.php tests/Unit/Bootstrapper/DatabaseSwitchBootstrapperTest.php tests/Unit/EventListener/TenantContextOrchestratorTest.php tests/Unit/PHPStan

      - name: PHPStan dogfood without Doctrine — prove optional-dep guards (WR-05)
        # Runs the base-only dogfood (extension.neon, resolver-less) over src/PHPStan — the
        # shipped rules — with Doctrine + phpstan-doctrine absent. Proves the rules load and
        # analyse clean without Doctrine; expected "Class Doctrine\* not found" hits on the
        # rules' ::class matchers are tolerated in the config (they're interface_exists-guarded
        # at runtime). The bundle's runtime Doctrine integration is intentionally out of scope
        # here — its graceful degradation is proven by the "Run unit tests without Doctrine"
        # step above, which actually executes the guarded code. See the neon config header.
        run: vendor/bin/phpstan analyse -c phpstan-extension-dogfood-nodoctrine.neon --memory-limit=512M

  prefer-lowest:
    runs-on: ubuntu-latest
    name: Prefer Lowest
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: flex
          coverage: none

      - uses: ramsey/composer-install@v4
        with:
          composer-options: --prefer-lowest --prefer-stable
        env:
          SYMFONY_REQUIRE: '7.4.*'

      # Excludes the PHPStan extension's RuleTestCase tests (group: phpstan-extension).
      # At the absolute-lowest dependency corner, PHPStan's analyse() error-handler
      # juggling collides with PHPUnit 11's strict "did not remove its own error
      # handlers" check once symfony/phpunit-bridge's deprecation handler is active
      # (SYMFONY_DEPRECATIONS_HELPER in phpunit.xml.dist) — a test-harness artifact,
      # not a rule defect. The rules themselves are fully covered on every supported
      # version by the matrix (vendor/bin/phpunit), the no-doctrine lane
      # (tests/Unit/PHPStan), and the dogfood step. See group tag on the *RuleTest classes.
      - run: vendor/bin/phpunit --exclude-group phpstan-extension

  no-messenger:
    runs-on: ubuntu-latest
    name: No Messenger (guards check)
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: flex
          coverage: none

      - uses: ramsey/composer-install@v4

      - name: Remove Messenger package
        run: composer remove --dev symfony/messenger --no-interaction

      - name: Run unit tests without Messenger
        run: vendor/bin/phpunit tests/Unit/Context tests/Unit/Event tests/Unit/Resolver tests/Unit/Cache tests/Unit/Exception tests/Unit/Attribute tests/Unit/DependencyInjection tests/Unit/Command tests/Unit/Bootstrapper tests/Unit/EventListener

  audit:
    runs-on: ubuntu-latest
    name: Composer Audit
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: flex
          coverage: none

      # No SYMFONY_REQUIRE: resolve the highest versions allowed by composer.json
      # so the audit reflects what a fresh consumer install (or CI run) actually
      # pulls. composer.lock is gitignored, so every install resolves fresh — this
      # job is the standing check that the latest in-range resolution carries no
      # known advisory. It goes red only when a dependency has a published CVE with
      # no patched release inside our constraints — i.e. a real "bump the floor or
      # add a constraint" signal.
      - uses: ramsey/composer-install@v4

      - run: composer audit